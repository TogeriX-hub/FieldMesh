title: "[Device] "
body:
  - type: markdown
    attributes:
      value: |
        Reports for the untested devices are very welcome: LilyGo T-Echo, RAK WisMesh Pocket V2 / RAK4631, Heltec T114, SenseCAP MeshTracker X1, RAK WisMesh Tag, ThinkNode M3, Heltec Mesh Node T1, Wio Tracker L1 E-Ink, Wio Tracker L1 1W - and any other device.
        Partial results help too - just tick what you tried.
        Only asking whether a device could work, or looking for testers? Fill in the device and write your question in the notes.

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Heltec Mesh Node T1
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Build environment
      placeholder: Heltec_t1_companion_radio_ble
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: FieldMesh version or commit
      placeholder: v2.1.0
    validations:
      required: false

  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Boots, splash screen shows FieldMesh
        - label: Display and button / joystick navigation
        - label: GPS fix and position in adverts
        - label: Tracking page (favourites with distance)
        - label: Off-Grid toggle on and off
        - label: Sending SOS
        - label: Receiving SOS (alarm and buzzer)
        - label: Message history
        - label: Battery reading
        - label: Battery lasts a full day of normal use
        - label: LED, buzzer and vibration signals (devices without display)
        - label: Pairing with the companion app
        - label: Update from stock MeshCore kept contacts and channels

  - type: textarea
    id: problems
    attributes:
      label: What does not work / notes / question
      description: Anything odd - wrong pins, display glitches, battery drain, crashes. Or your question about the device.
