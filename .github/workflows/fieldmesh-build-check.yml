# FieldMesh: compile check for the FieldMesh devices (the upstream PR Build Check
# does not build them). Separate file so upstream workflow changes merge cleanly.
name: FieldMesh Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: ['dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - ThinkNode_M1_companion_radio_ble
          - WioTrackerL1_companion_radio_ble
          - t1000e_companion_radio_ble
          - MeshTracker_X1_companion_radio_ble
          - Heltec_t1_companion_radio_ble
          # Companion wave 1 (2.3 #6): untested, test files for testers
          - LilyGo_T-Echo_companion_radio_ble
          - RAK_4631_companion_radio_ble          # also RAK WisMesh Pocket V2
          - Heltec_t114_companion_radio_ble
          - RAK_WisMesh_Tag_companion_radio_ble
          - ThinkNode_M3_companion_radio_ble
          - Station_G2_fieldmesh_repeater
          - Station_G2_repeater
          - Station_G3_ESP32_fieldmesh_repeater
          - heltec_v4_fieldmesh_repeater

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # FieldMesh version "dev-<commit>" and today's date (#17), also for the test files below
      - name: Version flags
        run: |
          echo "PLATFORMIO_BUILD_FLAGS=-DFIELDMESH_VERSION='\"dev-${GITHUB_SHA::7}\"' -DFIRMWARE_BUILD_DATE='\"$(LC_ALL=C date -u '+%d %b %Y')\"'" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      # FieldMesh repeaters: test files to download from the run (Summary -> Artifacts), kept 14 days.
      # _full.bin = whole image for USB at 0x0, _update.bin = app only (dashboard update).
      - name: Test files (FieldMesh repeaters)
        if: endsWith(matrix.environment, '_fieldmesh_repeater')
        run: |
          pio run -e "${{ matrix.environment }}" -t mergebin
          mkdir -p out
          B="${{ matrix.environment }}_FieldMesh-test-${GITHUB_SHA::7}"
          cp ".pio/build/${{ matrix.environment }}/firmware-merged.bin" "out/${B}_full.bin"
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" "out/${B}_update.bin"

      - name: Upload test files (FieldMesh repeaters)
        if: endsWith(matrix.environment, '_fieldmesh_repeater')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment }}-test
          path: out/*
          retention-days: 14

      # Companions (nRF52): the artifact itself is the DFU zip (firmware.bin, .dat and manifest.json at
      # its root), so the downloaded file goes straight into a flasher - no zip inside a zip. Kept 14 days.
      - name: Test files (companions)
        if: endsWith(matrix.environment, '_companion_radio_ble')
        run: |
          mkdir -p dfu
          unzip -o ".pio/build/${{ matrix.environment }}/firmware.zip" -d dfu
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload test files (companions)
        if: endsWith(matrix.environment, '_companion_radio_ble')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment }}_FieldMesh-test-${{ env.SHORT_SHA }}
          path: dfu/*
          retention-days: 14
