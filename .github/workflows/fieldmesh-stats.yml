# FieldMesh: daily usage numbers (release downloads, repo traffic, web flasher) on the branch
# 'stats'. GitHub keeps traffic for 14 days only; this keeps the history.
# Script and file format: docs/FieldMesh/stats/collect_stats.py
#
# Settings -> Secrets and variables -> Actions:
#   secret   STATS_TOKEN        fine-grained token for this repo, "Administration: Read-only"
#                               (traffic; the workflow token cannot read it). Without it: no traffic.
#   variable GOATCOUNTER_CODE   GoatCounter site code of the web flasher (also used by the flasher)
#   secret   GOATCOUNTER_TOKEN  GoatCounter API key with read access. Without it: no flasher numbers.
name: FieldMesh Stats

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # push to the 'stats' branch

concurrency:
  group: fieldmesh-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone script
        uses: actions/checkout@v6
        with:
          path: repo
          sparse-checkout: docs/FieldMesh/stats

      - name: Clone stats branch
        uses: actions/checkout@v6
        with:
          ref: stats
          path: stats

      - name: Collect
        id: collect
        continue-on-error: true   # save what was collected, report the failure afterwards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 repo/docs/FieldMesh/stats/collect_stats.py stats/data

      - name: Save
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -q -m "Stats $(date -u +%F)"
            git push
          fi

      - name: Report failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collecting failed for a part (see the Collect step) - the rest was saved"
          exit 1
